# Broker MQTT local do nó de borda edge-ubs (gerado pelo entrypoint)
per_listener_settings false
allow_anonymous false
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/mosquitto/
pid_file /mosquitto/data/mosquitto.pid

listener 8883 0.0.0.0
cafile /pki/ca-chain.crt
certfile /pki/edge-ubs.crt
keyfile /pki/edge-ubs.key
crlfile /pki/issuing.crl
require_certificate true
use_identity_as_username true
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305
ciphers_tls1.3 TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

log_dest file /mosquitto/data/mosquitto-ubs.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
