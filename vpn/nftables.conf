# Segmentação e menor privilégio no gateway WireGuard (RT-07, Zero Trust).
# Segmentos: borda (10.13.1.0/24), operadores (10.13.9.0/24), serviços de nuvem (10.13.0.0/24).
# Regra geral: nega tudo entre segmentos; libera só o estritamente necessário.
table inet vila {
  chains { }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept

    # Borda -> apenas a API de ingestão e o serviço de PKI/CRL na nuvem (mTLS)
    ip saddr 10.13.1.0/24 ip daddr 10.13.0.10 tcp dport { 8443, 9444 } accept

    # Operadores (admin) -> apenas painel (HTTPS) e serviço de aprovação, nunca a rede IoT
    ip saddr 10.13.9.0/24 ip daddr 10.13.0.10 tcp dport { 443, 9443 } accept

    # Proíbe explicitamente borda<->borda e operador->borda (sem movimento lateral)
    ip saddr 10.13.1.0/24 ip daddr 10.13.1.0/24 drop
    ip saddr 10.13.9.0/24 ip daddr 10.13.1.0/24 drop

    # Nenhuma porta administrativa exposta à internet: SSH/DB só dentro de 10.13.0.0/24
    log prefix "vila-drop " drop
  }
}
# Na LAN de cada espaço (atrás do nó de borda), os dispositivos IoT ficam numa VLAN separada
# dos equipamentos de operador; o nó de borda é o único a cruzar da VLAN IoT para a VPN.
